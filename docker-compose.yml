version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: logistream-postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: logistream
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d logistream"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: logistream-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    container_name: logistream-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      # Base64 URL-safe UUID for KRaft cluster format
      CLUSTER_ID: 4L62xNx7TqyMwJ6xEU24wA
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 5

  sorting-service:
    build:
      context: ./logistics-backend
      dockerfile: sorting-warehouse-service/Dockerfile
    container_name: logistream-sorting-service
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistream
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  websocket-service:
    build:
      context: ./logistics-backend
      dockerfile: fleet-tracking-websocket/Dockerfile
    container_name: logistream-websocket-service
    ports:
      - "8082:8082"
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/logistream
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  routing-engine:
    build:
      context: ./logistics-backend
      dockerfile: routing-optimization-engine/Dockerfile
    container_name: logistream-routing-engine
    ports:
      - "8083:8083"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092

  frontend:
    build:
      context: ./logistics-frontend
      dockerfile: Dockerfile
    container_name: logistream-frontend
    ports:
      - "80:80"
    depends_on:
      - sorting-service
      - websocket-service
      - routing-engine

volumes:
  postgres-data:
